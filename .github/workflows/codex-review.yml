name: Codex PR Review

# Reviews every push to a non-draft pull request, and a draft when it is
# marked ready for review, and posts the result as a new PR comment. Codex
# reads AGENTS.md itself; its "Reviewing pull requests" section says what to
# look for.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# A newer push to the same PR cancels the review of the older one, so the
# review that gets posted is always for the latest code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex review
    # Skip drafts, and runs that can't read OPENAI_API_KEY: PRs from forks,
    # and runs triggered by Dependabot (it only gets Dependabot secrets, and
    # codex-action refuses actors without write access).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      final-message: ${{ steps.codex.outputs.final-message }}
    steps:
      # The merge commit is what CI tests and what main will contain. Full
      # history keeps both parents: HEAD^1 is the base, HEAD^2 the PR head.
      - name: Check out the PR merge commit
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-6-luna
          safety-strategy: drop-sudo
          permission-profile: ":read-only"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            HEAD is the PR's merge commit: HEAD^1 is the base branch, HEAD^2 the PR head.
            - The change under review: `git diff HEAD^1 HEAD`
            - Its commits: `git log --oneline HEAD^1..HEAD^2`

            Review only what this PR changes, but read the surrounding code as needed
            (callers, types, interfaces, tests, docs) to judge it. Follow the
            "Reviewing pull requests" section of AGENTS.md.

            The sandbox is read-only and has no network, so do not build or run tests;
            CI does that. Report only high-confidence findings, most severe first. Give
            each a severity as AGENTS.md defines it, the file and line, a one-line title,
            and a body with a concrete failure scenario. No style or naming nitpicks.
            Put a one or two sentence overall assessment in `summary`. If you find
            nothing reliable, return no findings.
          # The verdict in the comment is derived from the severities, so it always
          # matches the findings.
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["summary", "findings"],
              "properties": {
                "summary": { "type": "string" },
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["severity", "file", "line", "title", "body"],
                    "properties": {
                      "severity": { "type": "string", "enum": ["must_fix", "consider"] },
                      "file": { "type": "string" },
                      "line": { "type": ["integer", "null"] },
                      "title": { "type": "string" },
                      "body": { "type": "string" }
                    }
                  }
                }
              }
            }

  comment:
    name: Post review comment
    needs: review
    if: needs.review.outputs.final-message != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          REVIEW_BODY: ${{ needs.review.outputs.final-message }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA.slice(0, 7);
            let body;
            try {
              const review = JSON.parse(process.env.REVIEW_BODY);
              const findings = review.findings ?? [];
              const mustFix = findings.filter(f => f.severity === 'must_fix');
              const consider = findings.filter(f => f.severity !== 'must_fix');
              const verdict =
                mustFix.length ? '🔴 Changes recommended' :
                consider.length ? '🟡 Changes to consider' :
                '🟢 Approval recommended';
              const section = (heading, list) => !list.length ? '' :
                `\n\n**${heading}**\n\n` + list.map((f, i) => {
                  const where = f.line ? `${f.file}:${f.line}` : f.file;
                  const text = f.body.trim().split('\n').join('\n   ');
                  return `${i + 1}. \`${where}\`: **${f.title}**\n   ${text}`;
                }).join('\n');
              body = `**Codex review** of ${sha}: **${verdict}**\n\n${review.summary}` +
                section('Must fix', mustFix) + section('To consider', consider);
            } catch (e) {
              // Not the JSON the schema asks for: post it as it is.
              body = `**Codex review** of ${sha}: **⚪ No verdict** (unexpected output format)\n\n${process.env.REVIEW_BODY}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
